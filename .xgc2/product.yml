schema: xgc2.product.v1
id: xgc2-ros-jazzy-mecanum-description
name: XGC2 ROS Jazzy Mecanum Description
version: 0.1.0-1
kind: ros2-apt
summary: ROS 2 Jazzy visual description assets for the XGC2 Mecanum UGV.
groups:
- gazebo-sim
- ugv-tracking
ros:
  distro: jazzy
  packages:
  - mecanum_description
apt:
  distribution: noble
  install:
  - ros-jazzy-xgc2-mecanum-description
  packages:
  - ros-jazzy-xgc2-mecanum-description
  package_architectures:
    ros-jazzy-xgc2-mecanum-description:
    - amd64
    - arm64
  depends:
  - ros-jazzy-urdf
usage:
  install: 'sudo apt update

    sudo apt install ros-jazzy-xgc2-mecanum-description

    '
  smoke_test: 'source /opt/ros/jazzy/setup.bash

    ros2 pkg prefix mecanum_description

    test -f /opt/ros/jazzy/share/mecanum_description/urdf/mecanum_visual.urdf

    '
ownership:
  paths:
  - /opt/ros/jazzy/share/mecanum_description
  - /opt/ros/jazzy/share/ament_index/resource_index/packages/mecanum_description
  - /opt/ros/jazzy/share/ament_index/resource_index/package_run_dependencies/mecanum_description
  - /opt/ros/jazzy/share/ament_index/resource_index/parent_prefix_path/mecanum_description
release:
  repository: lxk36/xgc2-mecanum-description
  ref: jazzy
  workflow: release.yml
  ci_workflow: ci.yml
  apt_versions:
    noble: 0.1.0-1
